<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYM WORLD 시트지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Jua&display=swap">
<style>
  :root{
    --bg:#131519; --surface:#1B1E24; --raised:#22262E; --line:#2E323B;
    --ink:#E8E2D4; --muted:#9A937F; --gold:#C9A233; --gold-deep:#8A6F1F;
    --gold-soft:rgba(201,162,51,.14); --ok:#7FB069; --warn:#C05B4D; --blue:#6C8EBF;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:15px; line-height:1.6}
  .wrap{max-width:1340px; margin:0 auto; padding:20px 16px 90px}
  .wtile{width:88px; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:7px 3px 6px; cursor:pointer; text-align:center; font-size:11px; color:#D8D2C2; line-height:1.25; font-family:inherit}
  .wtile img{width:44px; height:44px; display:block; margin:0 auto 3px}
  .wtile.on{background:var(--gold-soft); border-color:var(--gold); color:var(--gold); font-weight:700}
  .wtile:hover{border-color:var(--gold-deep)}
  header.top{display:flex; align-items:center; justify-content:center; gap:12px; border-bottom:2px solid var(--gold-deep); padding-bottom:10px; margin-bottom:16px}
  .logohead{display:flex; align-items:center; gap:16px; cursor:pointer}
  .logohead img{height:62px; border-radius:12px; border:2px solid var(--gold-deep)}
  .logotxt{display:flex; flex-direction:column; line-height:1.05}
  .lw{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:34px; color:#E8A33D; text-shadow:2px 2px 0 #59391D; letter-spacing:.02em}
  .st{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:15px; color:var(--gold); letter-spacing:.4em; margin-top:3px}
  .btn.join{background:transparent; color:#6C9BFF; border:1px solid #2653D9; margin-left:auto}
  .btn.join:hover{background:rgba(38,83,217,.18)}
  .btn.sortie{
    background:linear-gradient(120deg,#F5C044,#E86A2C,#D9376E,#E86A2C,#F5C044);
    background-size:250% 100%; color:#fff; font-weight:800; letter-spacing:.04em;
    text-shadow:0 1px 2px rgba(0,0,0,.45); box-shadow:0 0 14px 2px rgba(232,106,44,.5);
    animation:sortieShift 2.8s linear infinite;
  }
  .btn.sortie:hover{box-shadow:0 0 20px 4px rgba(232,106,44,.75)}
  @keyframes sortieShift{ 0%{background-position:0% 50%} 100%{background-position:250% 50%} }
  @media (prefers-reduced-motion: reduce){ .btn.sortie{animation:none} }
  @keyframes pulseGlow{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(201,162,51,0)}
    50%{opacity:.75; box-shadow:0 0 12px 3px rgba(201,162,51,.5)}
  }
  .btn.pulse, select.pulse{animation:pulseGlow 1.6s ease-in-out infinite}
  select.pulse{border-color:var(--gold-deep)}
  .btn.join.pulse{animation:pulseGlow 1.6s ease-in-out infinite; box-shadow:0 0 12px 2px rgba(38,83,217,.45)}
  @media (prefers-reduced-motion: reduce){ .btn.pulse, .btn.join.pulse{animation:none} }
  h1{font-family:'Noto Serif KR',serif; font-size:20px; color:var(--gold); font-weight:600; margin:0 0 4px}
  h2{font-size:13px; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; text-transform:uppercase}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:14px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .btn{background:var(--gold); color:#191509; border:none; border-radius:6px; padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit}
  .btn:hover{background:#DBB543}
  .btn.ghost{background:transparent; color:var(--gold); border:1px solid var(--gold-deep)}
  .btn.sm{padding:5px 12px; font-size:12.5px}
  .btn:disabled{opacity:.4; cursor:default}
  input[type=text],input[type=datetime-local],select,textarea{background:var(--raised); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px 12px; font-size:14px; font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-deep)}
  .chip{background:var(--raised); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; font-family:inherit; user-select:none}
  .chip.on{background:var(--gold); border-color:var(--gold); color:#191509; font-weight:700}
  .chip.warnon{background:var(--warn); border-color:var(--warn); color:#fff; font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .mem{background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:8px 11px; margin-bottom:7px; cursor:pointer}
  .mem.sel{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold)}
  .mem .nm{font-weight:700}
  .mem .sub{font-size:12px; color:var(--muted); margin-top:2px}
  .memowrap{display:inline-flex; align-items:center; gap:5px; border:1.5px dashed #6b7280; border-radius:7px; padding:2px 8px; font-size:12px; flex:0 1 auto; max-width:190px; background:rgba(255,255,255,.03)}
  .memowrap:focus-within{border-color:var(--gold); border-style:solid}
  .memoline{width:120px; min-width:60px; background:transparent; border:none; color:var(--ink); font-size:12px; padding:1px 2px; font-family:inherit}
  .memoline:focus{outline:none}
  .memoline::placeholder{color:#6b7280}
  .wtag{display:inline-block; font-size:11px; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--muted); margin:2px 3px 0 0}
  .wtag.hit{border-color:var(--gold-deep); color:var(--gold)}
  .wtag.catfull{background:var(--gold); border-color:var(--gold); color:#191509; font-weight:700; font-size:12px; padding:2px 9px}
  .slot{background:var(--raised); border:1px dashed var(--line); border-radius:8px; padding:9px 12px; margin-bottom:7px; cursor:pointer}
  .slot.sel{border-color:var(--gold); border-style:solid}
  .slot.over{border-color:var(--gold); border-style:solid; background:var(--gold-soft)}
  .slot[draggable="true"]{cursor:grab}
  .slot .req{font-size:12px; color:var(--muted)}
  .slot .req .pos{color:var(--gold); font-weight:700; font-size:13px; margin-right:8px}
  .slot .who{margin-top:3px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .slot .who .nm{font-weight:700}
  .slot .how{font-size:11px; color:var(--ok)}
  .slot .how.deleg{color:var(--blue)}
  .slot .empty{color:#4a5058; font-size:13px; margin-top:3px}
  .pinbtn{background:none;border:none;cursor:pointer;font-size:13px;padding:0 3px}
  .x{background:none; border:none; color:var(--warn); cursor:pointer; font-size:13px; padding:0 4px}
  .cols{display:grid; grid-template-columns:1.5fr 1fr; gap:12px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .compact{padding:9px 14px}
  .compact h1{font-size:15px; margin:0}
  .compact input,.compact select{padding:5px 9px; font-size:12.5px}
  .compact .btn{padding:5px 11px; font-size:12.5px}
  .compact .row{gap:6px; margin-top:5px}
  .evtabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:2px solid var(--gold-deep); display:flex; gap:4px; padding:6px 12px 8px; overflow-x:auto; z-index:20; align-items:center}
  .etab{background:var(--raised); border:1px solid var(--line); border-radius:0 0 9px 9px; padding:6px 16px; font-size:13px; color:var(--muted); cursor:pointer; white-space:nowrap; font-family:inherit}
  .etab.on{background:var(--gold); color:#191509; font-weight:700; border-color:var(--gold)}
  .etab:hover{border-color:var(--gold-deep); color:var(--gold)}
  .etab.on:hover{color:#191509}
  #pointhand{position:absolute; font-size:26px; animation:pointU 0.9s ease-in-out infinite; pointer-events:none; z-index:5}
  @keyframes pointU{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @media (prefers-reduced-motion: reduce){ #pointhand{animation:none} }
  .tclose{margin-left:9px; color:var(--warn); font-weight:700; font-size:12px; opacity:.65}
  .tclose:hover{opacity:1}
  .etab.on .tclose{color:#7a2318}
  .slotrow{display:flex; align-items:flex-start; gap:10px}
  .posbox{width:58px; flex:none; display:flex; flex-direction:column; padding-top:6px}
  .posbox .pos{color:var(--gold); font-weight:700; font-size:13.5px}
  select.posedit{background:transparent; border:none; color:var(--gold); font-weight:700; font-size:13px; font-family:inherit; cursor:pointer; padding:0; max-width:58px}
  select.posedit:hover{text-decoration:underline dotted}
  select.posedit option{background:var(--surface); color:var(--ink)}
  .posbox .reqlbl{font-size:10px; color:var(--muted); line-height:1.25}
  .slotrow .icons{flex:1; gap:6px; flex-wrap:nowrap; justify-content:space-between; align-items:flex-start}
  .slotrow .ibox{width:48px; height:48px}
  .slotrow .ibox img{width:46px; height:46px}
  .istack{display:flex; flex-direction:column; align-items:center; width:72px; flex:none}
  .ilbl{font-size:11px; color:#D8D2C2; font-weight:500; margin-top:3px; width:72px; height:28px; text-align:center; line-height:1.27; word-break:keep-all; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .who2{margin-left:12px; display:flex; align-items:center; gap:5px; flex:none; padding-top:10px; min-width:90px; justify-content:flex-end}
  .who2 .nm{background:var(--surface); border:1.5px solid var(--gold-deep); border-radius:8px; padding:4px 11px; font-size:14px; font-weight:700; color:var(--gold)}
  .asgrow{display:flex; gap:9px; align-items:center; padding:5px 8px; border-bottom:1px solid var(--line); font-size:13.5px}
  .asgrow .pos{color:var(--gold); font-weight:700; min-width:56px}
  .asgrow.mine{background:var(--gold-soft); border-radius:6px}
  .asgrow .you{color:var(--gold); font-size:11px; font-weight:700}
  .disc{background:#1F2430; border:1px solid #3A4254; border-radius:8px; padding:11px 13px; font-size:13px}
  .disc pre{margin:0; white-space:pre-wrap; font-family:inherit; line-height:1.65}
  .miss{color:var(--warn)}
  .cat h3{font-family:'Noto Serif KR',serif; font-size:15px; color:var(--gold); font-weight:600; margin:14px 0 7px; border-bottom:1px solid var(--line); padding-bottom:5px}
  .icons{display:flex; gap:5px; align-items:center; flex-wrap:wrap}
  .ibox{width:40px; height:40px; background:var(--surface); border:1px solid var(--line); border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer}
  .ibox img{width:38px; height:38px}
  .ibox.ghost{opacity:.4}
  .ibox.emptybox{border-style:dashed; color:var(--muted); font-size:15px; opacity:.7}
  .ibox.emptybox:hover{color:var(--gold); opacity:1}
  .ibox:hover{border-color:var(--gold)}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
  .modal .box{background:var(--surface); border:1px solid var(--gold-deep); border-radius:10px; padding:16px; max-width:560px; max-height:72vh; overflow:auto}
  .modal .box.big{max-width:1100px; width:94vw; max-height:84vh; padding:18px 22px}
  .psec h4{font-family:'Noto Serif KR',serif; color:var(--gold); font-size:14.5px; font-weight:600; margin:14px 0 8px; border-bottom:1px solid var(--line); padding-bottom:5px}
  .psec:first-of-type h4{margin-top:6px}
  .modal h3{margin:0 0 10px; color:var(--gold); font-size:15px; font-family:'Noto Serif KR',serif}
  .pgrid{display:flex; flex-wrap:wrap; gap:8px}
  .pitem{width:82px; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:6px 3px; cursor:pointer; text-align:center; font-size:11px; color:#D8D2C2; line-height:1.25; font-family:inherit}
  .pitem img{width:44px; height:44px; display:block; margin:0 auto 2px}
  .pitem:hover{border-color:var(--gold); color:var(--gold)}
  .pitem.hl{border-color:var(--gold-deep); background:var(--gold-soft); color:var(--gold)}
  .chip img{width:18px; height:18px; vertical-align:-4px; margin-right:3px}
  /* 스플래시 */
  #splash{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; opacity:1; transition:opacity .55s ease}
  #splash.out{opacity:0; pointer-events:none}
  #splash .coverlogo{animation:splIn .7s ease both}
  .splimg{max-width:min(400px,80vw); border-radius:14px; border:3px solid var(--gold-deep); box-shadow:0 8px 40px rgba(0,0,0,.5), 0 0 26px rgba(201,162,51,.2); animation:splIn .7s .15s ease both}
  @keyframes splIn{ from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion: reduce){ #splash .coverlogo, .splimg{animation:none} }
  /* 표지 */
  .cover{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:82vh; text-align:center; gap:14px; overflow:hidden}
  .coverlogo{display:flex; flex-direction:column; line-height:1.05}
  .clw{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:clamp(44px,8vw,72px); color:#E8A33D; text-shadow:3px 3px 0 #59391D, 0 0 24px rgba(232,163,61,.35); letter-spacing:.02em}
  .cst{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:clamp(18px,3vw,26px); color:var(--gold); letter-spacing:.55em; margin-top:6px; text-indent:.55em}
  .coverimg{max-width:min(460px,88vw); border-radius:16px; border:3px solid var(--gold-deep); box-shadow:0 8px 40px rgba(0,0,0,.55), 0 0 30px rgba(201,162,51,.18); margin-top:6px}
  .coverdesc{color:var(--muted); font-size:14.5px; letter-spacing:.06em; margin:4px 0 2px}
  .coverbtn{font-size:17px; padding:13px 46px; border-radius:10px; margin-left:0 !important}
  .spark{position:absolute; color:var(--gold); font-size:20px; opacity:0; animation:twinkle 2.6s ease-in-out infinite}
  @keyframes twinkle{ 0%,100%{opacity:0; transform:scale(.6)} 50%{opacity:.9; transform:scale(1.15)} }
  @media (prefers-reduced-motion: reduce){ .spark{animation:none; opacity:.5} }
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gold); color:#191509; padding:8px 18px; border-radius:999px; font-weight:700; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:99; max-width:90vw}
  .toast.show{opacity:1}
  .hint{color:var(--muted); font-size:12.5px; margin:6px 0 0}
  .evcard{background:var(--raised); border:1px solid var(--gold-deep); border-radius:8px; padding:13px 16px; margin-bottom:9px; cursor:pointer}
  .evcard h3{margin:0; font-size:16px; color:var(--gold); font-family:'Noto Serif KR',serif; font-weight:600}
  .evcard .sub{font-size:12.5px; color:var(--muted); margin-top:2px}
  .badge{display:inline-block; font-size:11px; border-radius:4px; padding:1px 7px; margin-left:8px; vertical-align:1px}
  .badge.open{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold-deep)}
  .badge.confirmed{background:rgba(127,176,105,.15); color:var(--ok); border:1px solid var(--ok)}
  .roster li{margin:3px 0; font-size:13.5px}
  .roster{columns:2; margin:8px 0; padding-left:20px}
  @media(max-width:600px){.roster{columns:1}}
  .center{text-align:center; color:var(--muted); padding:30px 0}
  a{color:var(--gold)}
</style>
</head>
<body>
<!-- 스플래시: 접속 시마다 잠깐 표시 후 사라짐 -->
<div id="splash">
  <div class="coverlogo">
    <span class="clw">LYM WORLD</span>
    <span class="cst">시 트 지</span>
  </div>
  <img src="chars.png" alt="" class="splimg">
</div>
<div class="wrap">
  <header class="top">
    <div class="logohead" onclick="location.hash=''; location.reload()" title="처음 화면으로 (새로고침)">
      <img src="chars.png" alt="Lym World">
      <div class="logotxt"><span class="lw">LYM WORLD</span><span class="st">시트지</span></div>
    </div>
    <span id="crumb" style="display:none"></span>
  </header>
  <div id="view"><div class="center">불러오는 중...</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ================= 설정 =================
const SUPABASE_URL = "https://gzzuvozbzrroioujeirs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ii2sGImrXlDUAScmtTXNAw_MlzrgmRf";

// ================= REST 헬퍼 =================
async function api(path, opt = {}) {
  const headers = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", ...(opt.headers || {}) };
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { ...opt, headers });
  if (!res.ok) { const t = await res.text(); throw new Error(res.status + " " + t.slice(0, 300)); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const get = p => api(p);
const post = (p, body, prefer = "return=representation") => api(p, { method: "POST", body: JSON.stringify(body), headers: { Prefer: prefer } });
const patch = (p, body) => api(p, { method: "PATCH", body: JSON.stringify(body), headers: { Prefer: "return=representation" } });
const del = p => api(p, { method: "DELETE" });
const upsert = (p, body) => api(p, { method: "POST", body: JSON.stringify(body), headers: { Prefer: "resolution=merge-duplicates,return=representation" } });

// ================= 상태 =================
let G = null;          // guild
let ENTITIES = [];     // 카탈로그
let EMAP = new Map();  // entity_id -> entity
let MEMBERS = [];      // 멤버(+무기)
let MYKEY = "sasi-me-"; // localStorage: 내 멤버 기억
let pollTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2200); }
function fmtTime(iso) { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

async function loadGuild(slug) {
  if (G && G.slug === slug) return;
  const gs = await get(`guilds_public?slug=eq.${encodeURIComponent(slug)}&select=*`);
  if (!gs.length) throw new Error("길드를 찾을 수 없습니다: " + slug);
  G = gs[0];
  MYKEY = "sasi-me-" + G.id;
  ENTITIES = await get(`entities?game_id=eq.${G.game_id}&active=is.true&order=category,sort_order&select=id,name,category,icon`);
  EMAP = new Map(ENTITIES.map(e => [e.id, e]));
  CAT_TOTAL = {};
  for (const e of ENTITIES) CAT_TOTAL[e.category] = (CAT_TOTAL[e.category] || 0) + 1;
  // "아무거나" 가상 장비 (재질별 기본 아이콘) — DB에는 없고 화면 전용
  const PSEUDO_ANY = [
    ["any_cloth_head", "HEAD_CLOTH_SET1", "머리"], ["any_leather_head", "HEAD_LEATHER_SET1", "머리"], ["any_plate_head", "HEAD_PLATE_SET1", "머리"],
    ["any_cloth_armor", "ARMOR_CLOTH_SET1", "갑옷"], ["any_leather_armor", "ARMOR_LEATHER_SET1", "갑옷"], ["any_plate_armor", "ARMOR_PLATE_SET1", "갑옷"],
    ["any_cloth_shoes", "SHOES_CLOTH_SET1", "신발"], ["any_leather_shoes", "SHOES_LEATHER_SET1", "신발"], ["any_plate_shoes", "SHOES_PLATE_SET1", "신발"],
    ["any_cape", "CAPE", "망토"],
  ];
  for (const [id, icon, category] of PSEUDO_ANY) EMAP.set(id, { id, name: "아무거나", category, icon });
}
const GEAR_CATS = ["머리", "갑옷", "신발", "망토"];
let CAT_TOTAL = {};
// 계열 전체를 선택한 경우 [검] 하나로 압축
function summarizeWeapons(ids) {
  const byCat = {};
  for (const id of ids) { const c = EMAP.get(id)?.category; if (!c) continue; (byCat[c] ??= []).push(id); }
  const fullCats = [], rest = [];
  for (const [c, list] of Object.entries(byCat)) {
    if (CAT_TOTAL[c] && list.length === CAT_TOTAL[c]) fullCats.push(c);
    else rest.push(...list);
  }
  return { fullCats, rest };
}
const GEAR_KEYS = ["armor", "head", "shoes", "cape"]; // 표시 순서: 갑옷-머리-신발-망토
const GEAR_KEY_CAT = { armor: "갑옷", head: "머리", shoes: "신발", cape: "망토" };
function goHome() {

const iconUrl = (eid, size = 64) => { const e = EMAP.get(eid); return e?.icon ? `https://render.albiononline.com/v1/item/T8_${e.icon}.png?quality=4&size=${size}` : null; };
function iconImg(eid, size = 44) {
  const u = iconUrl(eid); const e = EMAP.get(eid);
  return u ? `<img src="${u}" alt="" title="${esc(e?.name || "")}" width="${size}" height="${size}" loading="lazy">` : `<span style="font-size:10px">${esc(e?.name || "?")}</span>`;
}
// 역할순 정렬: 콜러 → 탱 → 힐러 → 서포터 → 딜러
function posPrio(pos) {
  const p = String(pos);
  if (p.includes("콜러")) return 0;                 // 1순위
  if (p.includes("탱")) return 1;                   // 2순위
  if (p.includes("딜")) return 2;                   // 3순위
  if (p.includes("힐")) return 3;                   // 4순위
  if (p.includes("서폿") || p.includes("서포터")) return 4;
  return 5;                                         // 미정 등
}
const sortSlotIdx = slots => slots.map((s, i) => ({ s, i })).sort((a, b) => posPrio(a.s.pos) - posPrio(b.s.pos) || a.i - b.i).map(x => x.i);
function pickEntity(title, ids, hl = new Set()) {
  return new Promise(res => {
    const ov = document.createElement("div"); ov.className = "modal";
    const item = id => `<button class="pitem${hl.has(id) ? " hl" : ""}" data-id="${id}" data-name="${esc(EMAP.get(id)?.name || "")}">${iconImg(id, 44)}${esc(EMAP.get(id)?.name || id)}</button>`;
    // 대분류별 그룹: 무기 = 계열(검/도끼…), 방어구 = 재질(천/가죽/판금)
    const groupOf = id => {
      const e = EMAP.get(id); if (!e) return "기타";
      if (GEAR_CATS.includes(e.category)) {
        const ic = e.icon || "";
        if (ic.includes("_CLOTH_")) return "천 계열";
        if (ic.includes("_LEATHER_")) return "가죽 계열";
        if (ic.includes("_PLATE_")) return "판금 계열";
        return e.category; // 망토 등
      }
      return e.category;
    };
    const groups = new Map();
    for (const id of ids) {
      const gname = groupOf(id);
      if (!groups.has(gname)) groups.set(gname, []);
      groups.get(gname).push(id);
    }
    let body = "";
    if (hl.size) body += `<div class="psec"><h4>★ 유저 선호 무기</h4><div class="pgrid">${[...hl].filter(id => EMAP.has(id)).map(item).join("")}</div></div>`;
    // 방어구 재질은 항상 천→가죽→판금 순서로
    const ORDER = ["천 계열", "가죽 계열", "판금 계열"];
    const keys = [...groups.keys()].sort((a, b) => {
      const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
      if (ia < 0 && ib < 0) return 0;
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    for (const gname of keys) body += `<div class="psec"><h4>${esc(gname)}</h4><div class="pgrid">${groups.get(gname).map(item).join("")}</div></div>`;
    ov.innerHTML = `<div class="box big"><h3>${esc(title)}</h3>
      <input type="text" class="psearch" placeholder="이름으로 검색..." style="width:100%; margin-bottom:6px">
      ${body}</div>`;
    const q = ov.querySelector(".psearch");
    q.addEventListener("click", e => e.stopPropagation());
    q.addEventListener("input", () => {
      const v = q.value.trim();
      ov.querySelectorAll(".pitem").forEach(p => p.style.display = (!v || p.dataset.name.includes(v)) ? "" : "none");
      ov.querySelectorAll(".psec").forEach(sec => {
        const any = [...sec.querySelectorAll(".pitem")].some(p => p.style.display !== "none");
        sec.style.display = any ? "" : "none";
      });
    });
    ov.addEventListener("click", e => {
      const b = e.target.closest(".pitem");
      if (b) { res(b.dataset.id); ov.remove(); }
      else if (e.target === ov) { res(null); ov.remove(); }
    });
    document.body.appendChild(ov);
    q.focus();
  });
}

      </div>

  let myWepSel = new Set();
  function renderMyWeps(mid) {
    const box = $("myweps"); box.innerHTML = "";
    const m = MEMBERS.find(x => x.id === mid);
    const mine = m ? memberWeapons(m) : [];
    const pool = [...new Set([...mine, ...[...needIds]])]; // 등록 무기 + 이번에 필요한 무기(즉석 추가 가능)
    if (!pool.length) { box.innerHTML = '<span class="hint">등록된 무기가 없습니다 — 홈에서 무기 등록을 먼저 해주세요</span>'; return; }
    for (const eid of pool) {
      const e = EMAP.get(eid); if (!e) continue;
      const need = needIds.has(eid) || needCats.has(e.category);
      const b = document.createElement("button"); b.className = "chip";
      b.innerHTML = (iconUrl(eid) ? `<img src="${iconUrl(eid, 32)}" alt="" loading="lazy">` : "") + esc(e.name) + (need ? ' <span style="color:var(--warn)">●</span>' : "") + (!mine.includes(eid) ? ' <span style="font-size:10px;color:var(--muted)">(미등록)</span>' : "");
      if (myWepSel.has(eid)) b.classList.add("on");
      b.onclick = () => { b.classList.toggle("on") ? myWepSel.add(eid) : myWepSel.delete(eid); };
      box.appendChild(b);
    }
  }
  $("who").onchange = e => { myWepSel.clear(); renderMyWeps(e.target.value); loadMyCheckin(e.target.value); };
  if (savedId && MEMBERS.some(m => m.id === savedId)) { $("who").value = savedId; renderMyWeps(savedId); loadMyCheckin(savedId); }

  let delegOn = false;
  $("deleg").onclick = () => { delegOn = !delegOn; $("deleg").classList.toggle("warnon", delegOn); };

  $("addnick").onclick = async () => {
    const nick = $("newnick").value.trim(); if (!nick) return toast("닉네임 입력");
    try {
      const rows = await post("members", { guild_id: G.id, nickname: nick });
      await loadMembers();
      $("who").innerHTML = `<option value="">— 내 닉네임 —</option>` + MEMBERS.map(m => `<option value="${m.id}">${esc(m.nickname)}</option>`).join("");
      $("who").value = rows[0].id; renderMyWeps(rows[0].id); toast("등록됐습니다!");
    } catch (e) { toast("이미 있는 닉네임이거나 오류: 목록에서 선택하세요"); }
  };
  async function loadMyCheckin(mid) {
    if (!mid) return;
    const rows = await get(`checkins?event_id=eq.${eventId}&member_id=eq.${mid}&select=*`);
    if (rows.length) {
      myWepSel = new Set(rows[0].entity_ids); delegOn = rows[0].delegate;
      $("deleg").classList.toggle("warnon", delegOn); $("memo").value = rows[0].memo || "";
      renderMyWeps(mid);
    }
  }
  $("join").onclick = async () => {
    const mid = $("who").value; if (!mid) return toast("닉네임을 선택해주세요");
    if (!myWepSel.size && !delegOn) return toast("무기를 고르거나 '아무거나'를 눌러주세요");
    await upsert(`checkins?on_conflict=event_id,member_id`, { event_id: eventId, member_id: mid, entity_ids: [...myWepSel], delegate: delegOn, memo: $("memo").value.trim() || null, is_late: ev.status !== "open" });
    localStorage.setItem(MYKEY, mid);
    toast("참가 신청 완료!"); refreshRoster();
  };
  $("cancel").onclick = async () => {
    const mid = $("who").value; if (!mid) return;
    await del(`checkins?event_id=eq.${eventId}&member_id=eq.${mid}`);

  };

  async function refreshRoster() {
    const rows = await get(`checkins?event_id=eq.${eventId}&order=created_at&select=entity_ids,delegate,memo,is_late,members(nickname)`);
    $("cicnt").textContent = `${rows.length}명`;
    $("roster").innerHTML = rows.map(c => {
      let weps;
      if (c.delegate) weps = "아무거나 🤝";
      else {
        const { fullCats, rest } = summarizeWeapons(c.entity_ids);
        weps = [...fullCats.map(cn => `<b style="color:var(--gold)">[${esc(cn)}]</b>`), ...rest.map(id => esc(EMAP.get(id)?.name || id))].join(", ");
      }
      return `<li><b>${esc(c.members.nickname)}</b> — ${weps}${c.memo ? ` <span class="hint">(${esc(c.memo)})</span>` : ""}${c.is_late ? ' <span style="color:var(--warn);font-size:11px">지각신청</span>' : ""}</li>`;
    }).join("") || '<span class="hint">아직 아무도 신청하지 않았습니다 — 첫 번째가 되어보세요!</span>';
    // 배정 현황 (읽기 전용, 내 자리 강조)
    const asg = await get(`assignments?event_id=eq.${eventId}&select=*`);
    const amap = {}; for (const a of asg) amap[a.slot_index] = a;
    const myId = localStorage.getItem(MYKEY);
    $("asgview").innerHTML = sortSlotIdx(ev.slots).map(i => {
      const s = ev.slots[i]; const a = amap[i];
      if (a && a.member_id) {
        const m = MEMBERS.find(x => x.id === a.member_id);
        const mine = a.member_id === myId;
        return `<div class="asgrow${mine ? " mine" : ""}"><span class="pos">${esc(s.pos)}</span>${iconImg(a.entity_id, 24)}<b>${esc(m?.nickname || "?")}</b><span class="hint">${esc(EMAP.get(a.entity_id)?.name || "")}</span>${mine ? '<span class="you">← 나</span>' : ""}</div>`;
      }
      return `<div class="asgrow"><span class="pos">${esc(s.pos)}</span><span class="hint">${esc(s.require.label)} — 모집 중</span></div>`;
    }).join("");
  }
  refreshRoster();
  pollTimer = setInterval(refreshRoster, 7000);
}

  async function openEvent(id) {
    const evs = await get(`events?id=eq.${id}&select=*`); EV = evs[0];
    // 장비 정보가 없는 (구버전) 이벤트면 템플릿에서 자동으로 채워넣기
    if (EV.template_id && EV.slots.some(s => !s.gear)) {
      const tp = await get(`templates?id=eq.${EV.template_id}&select=slots`);
      if (tp.length) {
        let changed = false;
        EV.slots.forEach((s, i) => { if (!s.gear && tp[0].slots[i]?.gear) { s.gear = tp[0].slots[i].gear; changed = true; } });
        if (changed) await patch(`events?id=eq.${EV.id}`, { slots: EV.slots });
      }
    }
    const asg = await get(`assignments?event_id=eq.${id}&select=*`);
    ASSIGN = {}; for (const a of asg) ASSIGN[a.slot_index] = a;
    $("board").style.display = "";
    $("emptybd").style.display = "none";
    if ($("pointhand")) $("pointhand").remove();
    renderTabs();
    await refresh();
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(refresh, 7000);
  }
  async function refresh() {
    CHECKINS = await get(`checkins?event_id=eq.${EV.id}&order=created_at&select=*,members(id,nickname,member_entities(entity_id))`);
    // 배정도 서버 기준으로 동기화 (저장 실패한 로컬 상태가 화면에 남지 않도록)
    const asg = await get(`assignments?event_id=eq.${EV.id}&select=*`);
    ASSIGN = {}; for (const a of asg) ASSIGN[a.slot_index] = a;
    // 메모 입력 중에는 체크인 목록을 다시 그리지 않음 (타이핑 날아감 방지)
    const typing = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("memoline");
    if (!typing) renderPool();
    renderSlots(); renderMsg();
  }
  const needIds = () => new Set(EV.slots.filter(s => s.require.type === "entity").map(s => s.require.value));
  function candWeapons(c) { // 이 참가자가 "오늘" 낼 수 있는 무기 풀
    if (c.delegate) return (c.members.member_entities || []).map(x => x.entity_id);
    return c.entity_ids;
  }
  function eligible(c, req) {
    const pool = candWeapons(c);
    if (req.type === "any") return pool.length ? { eid: pool[0], how: c.delegate ? "deleg" : "today" } : null;
    if (req.type === "entity") { if (pool.includes(req.value)) return { eid: req.value, how: c.delegate ? "deleg" : "today" }; return null; }
    const hit = pool.find(eid => EMAP.get(eid)?.category === req.value);
    return hit ? { eid: hit, how: c.delegate ? "deleg" : "today" } : null;
  }
  const assignedMids = () => new Set(Object.values(ASSIGN).map(a => a.member_id));

  function renderPool() {
    const box = $("pool"); box.innerHTML = "";
    const used = assignedMids(); const needs = needIds();
    let free = 0;
    for (const c of CHECKINS) {
      const mid = c.members.id;
      const d = document.createElement("div"); d.className = "mem" + (picked === mid ? " sel" : "");
      if (used.has(mid)) d.style.opacity = ".35";
      else free++;
      let weps;
      if (c.delegate) weps = '<span class="wtag hit">아무거나 🤝</span>';
      else {
        const { fullCats, rest } = summarizeWeapons(c.entity_ids);
        weps = fullCats.map(cn => `<span class="wtag catfull">${esc(cn)}</span>`).join("") +
          rest.map(id => `<span class="wtag${needs.has(id) ? " hit" : ""}">${esc(EMAP.get(id)?.name || id)}</span>`).join("");
      }
      d.innerHTML = `<div class="row" style="gap:7px; flex-wrap:nowrap"><span class="nm">${esc(c.members.nickname)}</span><span class="memowrap">💬<input class="memoline" value="${esc(c.memo || "")}" placeholder="메모..." maxlength="80"></span>${c.is_late ? '<span style="color:var(--warn);font-size:11px">지각</span>' : ""}</div><div>${weps}</div>`;
      d.draggable = !used.has(mid);
      d.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", "m:" + mid));
      // 인라인 메모: 클릭해서 바로 작성, 포커스 빠지면 자동 저장
      const memoInp = d.querySelector(".memoline");
      memoInp.addEventListener("click", e => e.stopPropagation());
      memoInp.addEventListener("mousedown", e => e.stopPropagation());
      memoInp.addEventListener("focus", () => { d.draggable = false; });
      memoInp.addEventListener("keydown", e => { if (e.key === "Enter") memoInp.blur(); });
      memoInp.addEventListener("blur", async () => {
        d.draggable = !used.has(mid);
        const v = memoInp.value.trim();
        if (v === (c.memo || "")) return;
        c.memo = v || null;
        await patch(`checkins?event_id=eq.${EV.id}&member_id=eq.${mid}`, { memo: v || null });
      });
      d.onclick = () => { if (used.has(mid)) return; picked = picked === mid ? null : mid; renderPool(); if (picked && selSlot != null) placeSel(); };
      box.appendChild(d);
    }
    $("cicnt2").textContent = `${CHECKINS.length}명 신청 / ${free}명 대기`;
  }
  const slotOrder = () => sortSlotIdx(EV.slots);
  function renderSlots() {
    const box = $("slots"); box.innerHTML = "";
    slotOrder().forEach(i => { const s = EV.slots[i];
      const a = ASSIGN[i];
      const el = document.createElement("div"); el.className = "slot" + (selSlot === i ? " sel" : "");
      // 장비칸 (갑옷/머리/신발/망토) — 배정된 사람에게 귀속, 사람이 이동하면 같이 이동
      const ghost = !(a && a.member_id);
      const g = (!ghost ? (a.gear || s.gear) : s.gear) || {};
      const stack = (inner, label) => `<div class="istack">${inner}<span class="ilbl">${esc((label || "").replace(/ ?스태프$/, ""))}</span></div>`; // 라벨은 '스태프' 생략해 짧게
      const gearStacks = GEAR_KEYS.map(k => {
        // 빈 슬롯은 장비 미리보기 없이 전부 ＋ 빈칸 (배정되면 그 사람의 장비 아이콘 표시)
        if (!ghost && g[k]) return stack(`<button class="ibox gearbox" data-i="${i}" data-k="${k}" draggable="true" title="장비 변경 (드래그=교환)">${iconImg(g[k])}</button>`, EMAP.get(g[k])?.name);
        return stack(`<button class="ibox gearbox emptybox" data-i="${i}" data-k="${k}" title="${GEAR_KEY_CAT[k]} 선택">＋</button>`, GEAR_KEY_CAT[k]);
      }).join("");
      let wstack, who2;
      if (!ghost) {
        const m = MEMBERS.find(x => x.id === a.member_id);
        wstack = stack(`<button class="ibox wbox" data-i="${i}" draggable="true" title="무기 변경 (클릭=선택, 드래그=교환)">${iconImg(a.entity_id)}</button>`, EMAP.get(a.entity_id)?.name);
        who2 = `<div class="who2">
          <span class="nm" draggable="true" data-i="${i}" title="이름을 드래그하면 다른 슬롯과 자리 교체" style="cursor:grab">${esc(m?.nickname || "?")}</span>
          <button class="x" data-i="${i}">✕</button></div>`;
      } else {
        // 빈 슬롯은 무기 미리보기 없이 빈칸 통일 (요구 무기는 좌측 라벨에 표시)
        wstack = stack(`<span class="ibox emptybox ghost">🗡</span>`, "무기");
        who2 = `<div class="who2"><span class="empty">비어 있음</span></div>`;
      }
      el.innerHTML = `<div class="slotrow">
        <div class="posbox">
          <select class="posedit" data-i="${i}" title="포지션 선택">
            ${ROLES.map(r => `<option${r === s.pos ? " selected" : ""}>${r}</option>`).join("")}
            ${ROLES.includes(s.pos) ? "" : `<option selected>${esc(s.pos)}</option>`}
          </select>
          <span class="reqlbl">${s.require.type === "entity" ? esc(s.require.label) : ""}</span></div>
        <div class="icons">${wstack}${gearStacks}</div>
        ${who2}</div>`;
      el.onclick = e => {
        if (e.target.closest(".x, .pinbtn, .ibox, .posedit")) return;
        selSlot = selSlot === i ? null : i; renderSlots();
        if (picked && selSlot != null) placeSel();
      };
      // 참가자 카드를 슬롯 위로 드래그해서 배정
      el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
      el.addEventListener("dragleave", () => el.classList.remove("over"));
      el.addEventListener("drop", async e => {
        e.preventDefault(); el.classList.remove("over");
        const d = e.dataTransfer.getData("text/plain");
        if (d.startsWith("m:")) await placeMember(d.slice(2), i);
        else if (d.startsWith("n:")) await movePerson(+d.slice(2), i);
        else if (d.startsWith("w:")) await swapWeapon(+d.slice(2), i);
        else if (d.startsWith("g:")) { const [, from, k] = d.split(":"); await swapGear(+from, i, k); }
      });
      box.appendChild(el);
    });
    box.querySelectorAll(".x").forEach(x => x.onclick = async () => {
      const i = +x.dataset.i;
      if (ASSIGN[i]?.id) await del(`assignments?event_id=eq.${EV.id}&slot_index=eq.${i}`);
      delete ASSIGN[i]; renderAll();
    });
    box.querySelectorAll(".posedit").forEach(p => {
      p.addEventListener("click", e => e.stopPropagation());
      p.onchange = async () => {
        const i = +p.dataset.i;
        EV.slots[i].pos = p.value;
        await patch(`events?id=eq.${EV.id}`, { slots: EV.slots });
        renderSlots(); renderMsg();
      };
    });
    box.querySelectorAll('.nm[draggable="true"]').forEach(n => n.addEventListener("dragstart", e => {
      e.stopPropagation();
      e.dataTransfer.setData("text/plain", "n:" + n.dataset.i);
    }));
    box.querySelectorAll(".wbox").forEach(b => b.addEventListener("dragstart", e => {
      e.stopPropagation();
      e.dataTransfer.setData("text/plain", "w:" + b.dataset.i);
    }));
    box.querySelectorAll(".gearbox:not(.ghost)").forEach(b => b.addEventListener("dragstart", e => {
      e.stopPropagation();
      e.dataTransfer.setData("text/plain", "g:" + b.dataset.i + ":" + b.dataset.k);
    }));
    box.querySelectorAll(".wbox").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const i = +b.dataset.i; const a = ASSIGN[i]; if (!a) return;
      const m = MEMBERS.find(x => x.id === a.member_id);
      const ci = CHECKINS.find(x => x.members.id === a.member_id);
      // 콜러 재량: 전체 무기에서 자유 선택. 오늘 낸 무기는 금색 강조 + 앞쪽 정렬
      const today = new Set([a.entity_id, ...(ci ? candWeapons(ci) : (m?.member_entities || []).map(x => x.entity_id))].filter(Boolean));
      const allWeps = ENTITIES.filter(x => !GEAR_CATS.includes(x.category)).map(x => x.id);
      const ids = [...new Set([...today, ...allWeps])];
      const sel = await pickEntity(`${m?.nickname || ""} — 무기 선택 (금색 = 유저 선호 무기)`, ids, today);
      if (!sel || sel === a.entity_id) return;
      ASSIGN[i].entity_id = sel;
      await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(i));
      renderSlots(); renderMsg(); toast("무기를 변경했습니다");
    });
    box.querySelectorAll(".gearbox").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const i = +b.dataset.i, k = b.dataset.k;
      const catName = GEAR_KEY_CAT[k];
      const anyIds = [...EMAP.values()].filter(x => x.id.startsWith("any_") && x.category === catName).map(x => x.id);
      const ids = [...anyIds, ...ENTITIES.filter(x => x.category === catName).map(x => x.id)];
      const sel = await pickEntity(`${EV.slots[i].pos} — ${catName} 변경`, ids);
      if (!sel) return;
      if (ASSIGN[i] && ASSIGN[i].member_id) {
        // 배정된 사람의 장비 — 그 사람에게 귀속 (자리를 옮겨도 따라감)
        ASSIGN[i].gear = { ...(ASSIGN[i].gear || EV.slots[i].gear || {}), [k]: sel };
        await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(i));
      } else {
        // 빈 슬롯의 권장 장비 — 이 이벤트의 기본값
        EV.slots[i].gear = { ...(EV.slots[i].gear || {}), [k]: sel };
        await patch(`events?id=eq.${EV.id}`, { slots: EV.slots });
      }
      renderSlots(); toast("장비를 변경했습니다");
    });
  }
  const rowOf = i => ({ event_id: EV.id, slot_index: i, member_id: ASSIGN[i].member_id, entity_id: ASSIGN[i].entity_id, pinned: !!ASSIGN[i].pinned, source: ASSIGN[i].source || "manual", gear: ASSIGN[i].gear ?? null });
  async function placeMember(mid, idx) {
    const c = CHECKINS.find(x => x.members.id === mid);
    const req = EV.slots[idx].require;
    const hit = c ? eligible(c, req) : null;
    // 콜러 재량: 무기가 안 맞아도 배정은 항상 허용. 무기는 최선값으로 채우고 아이콘 클릭으로 조정
    let eid = hit?.eid;
    if (!eid) {
      const pool = c ? candWeapons(c) : [];
      eid = (req.type === "entity" ? req.value : ENTITIES.find(x => x.category === req.value)?.id) || pool[0] || null;
      toast("유저 선호 무기와 다른 슬롯입니다 — 무기 아이콘을 눌러 조정하세요");
    }
    let carryGear = null; // 이미 배정돼 있던 사람이면 장비 세트가 같이 따라간다
    for (const k of Object.keys(ASSIGN)) if (ASSIGN[k].member_id === mid) { carryGear = ASSIGN[k].gear ?? null; await del(`assignments?event_id=eq.${EV.id}&slot_index=eq.${k}`); delete ASSIGN[k]; }
    ASSIGN[idx] = { member_id: mid, entity_id: eid, pinned: false, source: "manual", gear: carryGear ?? (EV.slots[idx].gear || null) };
    await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(idx));
    renderAll(); return true;
  }
  async function placeSel() {
    await placeMember(picked, selSlot);
    picked = null; selSlot = null; renderAll();
  }
  // 새 슬롯에 맞는 무기 고르기: 오늘 낸 무기 중 매칭 → 없으면 슬롯 기본 무기
  function weaponFor(mid, idx) {
    const c = CHECKINS.find(x => x.members.id === mid);
    const req = EV.slots[idx].require;
    const hit = c ? eligible(c, req) : null;
    if (hit) return hit.eid;
    const pool = c ? candWeapons(c) : [];
    return (req.type === "entity" ? req.value : ENTITIES.find(x => x.category === req.value)?.id) || pool[0] || null;
  }
  // 사람 자리 이동/교체: 이름을 드래그 — 장비는 사람을 따라가고, 무기는 새 역할에 맞게 재선정
  async function movePerson(from, to) {
    if (from === to) return;
    const a = ASSIGN[from], b = ASSIGN[to];
    if (!a) return;
    await del(`assignments?event_id=eq.${EV.id}&slot_index=in.(${from},${to})`);
    delete ASSIGN[from]; delete ASSIGN[to];
    ASSIGN[to] = { ...a, entity_id: weaponFor(a.member_id, to), pinned: false, source: "manual" };
    if (b) ASSIGN[from] = { ...b, entity_id: weaponFor(b.member_id, from), pinned: false, source: "manual" };
    await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(to));
    if (b) await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(from));
    renderAll();
    toast(b ? "두 사람의 자리를 교체했습니다 (무기는 역할에 맞게 조정)" : "자리를 이동했습니다");
  }
  // 무기 교환: 배정된 두 사람의 무기만 서로 맞바꿈 (사람·장비는 그대로)
  async function swapWeapon(from, to) {
    if (from === to) return;
    const a = ASSIGN[from], b = ASSIGN[to];
    if (!a || !b) { toast("빈 슬롯과는 교환할 수 없습니다"); return; }
    [a.entity_id, b.entity_id] = [b.entity_id, a.entity_id];
    await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(from));
    await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(to));
    renderSlots(); renderMsg(); toast("무기를 교환했습니다");
  }
  // 장비 한 조각 교환 (머리/갑옷/신발 중 끌어온 것만)
  async function swapGear(from, to, k) {
    if (from === to) return;
    const a = ASSIGN[from], b = ASSIGN[to];
    if (!a || !b) { toast("빈 슬롯과는 교환할 수 없습니다"); return; }
    const ga = { ...(a.gear || EV.slots[from].gear || {}) };
    const gb = { ...(b.gear || EV.slots[to].gear || {}) };
    [ga[k], gb[k]] = [gb[k], ga[k]];
    a.gear = ga; b.gear = gb;
    await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(from));
    await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(to));
    renderSlots(); toast("장비를 교환했습니다");
  }
  $("auto").onclick = async () => {
    try {
      for (const k of Object.keys(ASSIGN)) if (!ASSIGN[k].pinned) { await del(`assignments?event_id=eq.${EV.id}&slot_index=eq.${k}`); delete ASSIGN[k]; }
      const used = new Set(Object.values(ASSIGN).map(a => a.member_id));
      const open = EV.slots.map((s, i) => ({ i, req: s.require })).filter(x => !ASSIGN[x.i]);
      const people = CHECKINS.filter(c => !used.has(c.members.id));
      // 최대 매칭 (Kuhn): 여러 역할이 가능한 사람이 엉뚱한 슬롯에 소모되지 않도록
      const adj = open.map(x => people.map((c, pi) => eligible(c, x.req) ? pi : -1).filter(pi => pi >= 0));
      const matchP = new Array(people.length).fill(-1); // person -> slot(open index)
      function tryKuhn(k, seen) {
        for (const pi of adj[k]) {
          if (seen.has(pi)) continue;
          seen.add(pi);
          if (matchP[pi] === -1 || tryKuhn(matchP[pi], seen)) { matchP[pi] = k; return true; }
        }
        return false;
      }
      const order = open.map((_, k) => k).sort((a, b) => adj[a].length - adj[b].length);
      for (const k of order) tryKuhn(k, new Set());
      let placed = 0;
      for (let pi = 0; pi < people.length; pi++) {
        const k = matchP[pi]; if (k === -1) continue;
        const c = people[pi]; const hit = eligible(c, open[k].req);
        ASSIGN[open[k].i] = { member_id: c.members.id, entity_id: hit.eid, pinned: false, source: "auto", gear: EV.slots[open[k].i].gear || null };
        await upsert(`assignments?on_conflict=event_id,slot_index`, rowOf(open[k].i));
        placed++;
      }
      const missing = EV.slots.filter((s, i) => !ASSIGN[i]).length;
      renderAll();
      toast(`자동 초안: ${placed}명 배정` + (missing ? ` · ${missing}슬롯 미충원 (해당 무기 신청자 없음)` : " · 전 슬롯 충원!"));
    } catch (e) { toast("자동 초안 저장 오류: " + e.message.slice(0, 80)); }
  };
  $("clearAll").onclick = async () => {
    await del(`assignments?event_id=eq.${EV.id}`); ASSIGN = {}; renderAll();
  };
  function renderMsg() {
    if (!$("msg")) return; // 미리보기 패널 없는 간소화 레이아웃
    const lines = [`⚔️ **${EV.title}**${EV.starts_at ? " — " + fmtTime(EV.starts_at) + " 출발" : ""}`, EV.spec || "", ""];
    const missing = [];
    slotOrder().forEach(i => { const s = EV.slots[i];
      const a = ASSIGN[i];
      if (a && a.member_id) {
        const m = MEMBERS.find(x => x.id === a.member_id);
        lines.push(`${s.pos} — ${m?.nickname || "?"} (${EMAP.get(a.entity_id)?.name || ""})`);
      } else missing.push(`${s.pos}(${s.require.label})`);
    });
    $("msg").innerHTML = esc(lines.join("\n")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>") +
      (missing.length ? `\n\n<span class="miss">⚠ 미충원: ${esc(missing.join(", "))}</span>` : "\n\n✅ 전 슬롯 충원");
  }
  function renderAll() { renderPool(); renderSlots(); renderMsg(); }
  if (events.length) openEvent(events[0].id);
  else showEmptyBoard();
}

route();

// 스플래시: 1.8초 후 자동으로 사라짐 (클릭하면 즉시 건너뜀)
(() => {
  const sp = document.getElementById("splash");
  if (!sp) return;
  const hide = () => { sp.classList.add("out"); setTimeout(() => sp.remove(), 600); };
  sp.addEventListener("click", hide);
  setTimeout(hide, 1800);
})();
</script>
</body>
</html>
