<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LYM WORLD 시트지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Jua&display=swap">
<style>
  :root{
    --bg:#131519; --surface:#1B1E24; --raised:#22262E; --line:#2E323B;
    --ink:#E8E2D4; --muted:#9A937F; --gold:#C9A233; --gold-deep:#8A6F1F;
    --gold-soft:rgba(201,162,51,.14); --ok:#7FB069; --warn:#C05B4D; --blue:#6C8EBF;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:15px; line-height:1.6}
  .wrap{max-width:1340px; margin:0 auto; padding:20px 16px 90px}
  .wtile{width:88px; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:7px 3px 6px; cursor:pointer; text-align:center; font-size:11px; color:#D8D2C2; line-height:1.25; font-family:inherit}
  .wtile img{width:44px; height:44px; display:block; margin:0 auto 3px}
  .wtile.on{background:var(--gold-soft); border-color:var(--gold); color:var(--gold); font-weight:700}
  .wtile:hover{border-color:var(--gold-deep)}
  header.top{display:flex; align-items:center; justify-content:center; gap:12px; border-bottom:2px solid var(--gold-deep); padding-bottom:10px; margin-bottom:16px}
  .logohead{display:flex; align-items:center; gap:16px; cursor:pointer}
  .logohead img{height:62px; border-radius:12px; border:2px solid var(--gold-deep)}
  .logotxt{display:flex; flex-direction:column; line-height:1.05}
  .lw{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:34px; color:#E8A33D; text-shadow:2px 2px 0 #59391D; letter-spacing:.02em}
  .st{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:15px; color:var(--gold); letter-spacing:.4em; margin-top:3px}
  .btn.join{background:transparent; color:#6C9BFF; border:1px solid #2653D9; margin-left:auto}
  .btn.join:hover{background:rgba(38,83,217,.18)}
  .btn.sortie{
    background:linear-gradient(120deg,#F5C044,#E86A2C,#D9376E,#E86A2C,#F5C044);
    background-size:250% 100%; color:#fff; font-weight:800; letter-spacing:.04em;
    text-shadow:0 1px 2px rgba(0,0,0,.45); box-shadow:0 0 14px 2px rgba(232,106,44,.5);
    animation:sortieShift 2.8s linear infinite;
  }
  .btn.sortie:hover{box-shadow:0 0 20px 4px rgba(232,106,44,.75)}
  @keyframes sortieShift{ 0%{background-position:0% 50%} 100%{background-position:250% 50%} }
  @media (prefers-reduced-motion: reduce){ .btn.sortie{animation:none} }
  @keyframes pulseGlow{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(201,162,51,0)}
    50%{opacity:.75; box-shadow:0 0 12px 3px rgba(201,162,51,.5)}
  }
  .btn.pulse, select.pulse{animation:pulseGlow 1.6s ease-in-out infinite}
  select.pulse{border-color:var(--gold-deep)}
  .btn.join.pulse{animation:pulseGlow 1.6s ease-in-out infinite; box-shadow:0 0 12px 2px rgba(38,83,217,.45)}
  @media (prefers-reduced-motion: reduce){ .btn.pulse, .btn.join.pulse{animation:none} }
  h1{font-family:'Noto Serif KR',serif; font-size:20px; color:var(--gold); font-weight:600; margin:0 0 4px}
  h2{font-size:13px; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; text-transform:uppercase}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:14px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .btn{background:var(--gold); color:#191509; border:none; border-radius:6px; padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit}
  .btn:hover{background:#DBB543}
  .btn.ghost{background:transparent; color:var(--gold); border:1px solid var(--gold-deep)}
  .btn.sm{padding:5px 12px; font-size:12.5px}
  .btn:disabled{opacity:.4; cursor:default}
  input[type=text],input[type=datetime-local],select,textarea{background:var(--raised); border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:8px 12px; font-size:14px; font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-deep)}
  .chip{background:var(--raised); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer; font-family:inherit; user-select:none}
  .chip.on{background:var(--gold); border-color:var(--gold); color:#191509; font-weight:700}
  .chip.warnon{background:var(--warn); border-color:var(--warn); color:#fff; font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .mem{background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:8px 11px; margin-bottom:7px; cursor:pointer}
  .mem.sel{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold)}
  .mem .nm{font-weight:700}
  .mem .sub{font-size:12px; color:var(--muted); margin-top:2px}
  .memowrap{display:inline-flex; align-items:center; gap:5px; border:1.5px dashed #6b7280; border-radius:7px; padding:2px 8px; font-size:12px; flex:0 1 auto; max-width:190px; background:rgba(255,255,255,.03)}
  .memowrap:focus-within{border-color:var(--gold); border-style:solid}
  .memoline{width:120px; min-width:60px; background:transparent; border:none; color:var(--ink); font-size:12px; padding:1px 2px; font-family:inherit}
  .memoline:focus{outline:none}
  .memoline::placeholder{color:#6b7280}
  .wtag{display:inline-block; font-size:11px; background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--muted); margin:2px 3px 0 0}
  .wtag.hit{border-color:var(--gold-deep); color:var(--gold)}
  .wtag.catfull{background:var(--gold); border-color:var(--gold); color:#191509; font-weight:700; font-size:12px; padding:2px 9px}
  .slot{background:var(--raised); border:1.5px dashed var(--line); border-radius:8px; padding:9px 12px; margin-bottom:7px; cursor:pointer}
  /* 역할군별 테두리색 */
  .slot.r-caller{border:2px solid #6FC6E8; background:rgba(111,198,232,.06)}
  .slot.r-tank{border:2px solid #5B85E0; background:rgba(91,133,224,.06)}
  .slot.r-dps{border:2px solid #D96A6A; background:rgba(217,106,106,.06)}
  .slot.r-sup{border:2px solid #A985E8; background:rgba(169,133,232,.06)}
  .slot.r-heal{border:2px solid #6BC271; background:rgba(107,194,113,.07)}
  .slot.sel{border-color:var(--gold); border-style:solid}
  .slot.over{border-color:var(--gold); border-style:solid; background:var(--gold-soft)}
  .slot[draggable="true"]{cursor:grab}
  .slot .req{font-size:12px; color:var(--muted)}
  .slot .req .pos{color:var(--gold); font-weight:700; font-size:13px; margin-right:8px}
  .slot .who{margin-top:3px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .slot .who .nm{font-weight:700}
  .slot .how{font-size:11px; color:var(--ok)}
  .slot .how.deleg{color:var(--blue)}
  .slot .empty{color:#4a5058; font-size:13px; margin-top:3px}
  .pinbtn{background:none;border:none;cursor:pointer;font-size:13px;padding:0 3px}
  .x{background:none; border:none; color:var(--warn); cursor:pointer; font-size:13px; padding:0 4px}
  .cols{display:grid; grid-template-columns:1.5fr 1fr; gap:12px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .compact{padding:9px 14px}
  .compact h1{font-size:15px; margin:0}
  .compact input,.compact select{padding:5px 9px; font-size:12.5px}
  .compact .btn{padding:5px 11px; font-size:12.5px}
  .compact .row{gap:6px; margin-top:5px}
  .evtabs{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:2px solid var(--gold-deep); display:flex; gap:4px; padding:6px 12px 8px; overflow-x:auto; z-index:20; align-items:center}
  .etab{background:var(--raised); border:1px solid var(--line); border-radius:0 0 9px 9px; padding:6px 16px; font-size:13px; color:var(--muted); cursor:pointer; white-space:nowrap; font-family:inherit}
  .etab.on{background:var(--gold); color:#191509; font-weight:700; border-color:var(--gold)}
  .etab:hover{border-color:var(--gold-deep); color:var(--gold)}
  .etab.on:hover{color:#191509}
  .centerctl{margin-left:auto; margin-right:auto; display:inline-flex; align-items:center; gap:7px}
  .reghint{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25; animation:blinkT 1.3s ease-in-out infinite; white-space:nowrap}
  .reghint .rh1{font-size:11.5px; color:var(--gold); font-weight:700}
  .reghint .rh2{font-size:9.5px; color:var(--muted)}
  .shand3{display:inline-block; font-size:16px; animation:pointR 1s ease-in-out infinite}
  @keyframes pointR{ 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }
  @media (prefers-reduced-motion: reduce){ .reghint, .shand3{animation:none} }
  .sortiehint{color:var(--muted); font-size:11.5px; display:inline-flex; align-items:center; gap:3px; white-space:nowrap}
  .sortiehint .shand{display:inline-block; font-size:16px; animation:pointL2 1s ease-in-out infinite}
  @keyframes pointL2{ 0%,100%{transform:translateX(0)} 50%{transform:translateX(-5px)} }
  @media (prefers-reduced-motion: reduce){ .sortiehint .shand{animation:none} }
  #pointhand{position:absolute; font-size:26px; animation:pointU 0.9s ease-in-out infinite; pointer-events:none; z-index:5}
  .blinkph{min-width:190px !important}
  .blinkph::placeholder{color:var(--gold); font-weight:700; animation:blinkT 1.3s ease-in-out infinite}
  @keyframes blinkT{ 0%,100%{opacity:1} 50%{opacity:.3} }
  @media (prefers-reduced-motion: reduce){ .blinkph::placeholder{animation:none} }
  @keyframes pointU{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @media (prefers-reduced-motion: reduce){ #pointhand{animation:none} }
  .tclose{margin-left:9px; color:var(--warn); font-weight:700; font-size:12px; opacity:.65}
  .tclose:hover{opacity:1}
  .etab.on .tclose{color:#7a2318}
  .slotrow{display:flex; align-items:flex-start; gap:10px}
  .posbox{width:58px; flex:none; display:flex; flex-direction:column; padding-top:6px}
  .posbox .pos{color:var(--gold); font-weight:700; font-size:13.5px}
  select.posedit{background:transparent; border:none; color:var(--gold); font-weight:700; font-size:13px; font-family:inherit; cursor:pointer; padding:0; max-width:58px}
  select.posedit:hover{text-decoration:underline dotted}
  select.posedit option{background:var(--surface); color:var(--ink)}
  .posbox .reqlbl{font-size:10px; color:var(--muted); line-height:1.25}
  .slotrow .icons{flex:1; gap:7px; flex-wrap:nowrap; justify-content:flex-start; align-items:flex-start}
  .slotrow .ibox{width:46px; height:46px}
  .slotrow .ibox img{width:44px; height:44px}
  .istack{display:flex; flex-direction:column; align-items:center; width:62px; flex:none}
  .ilbl{font-size:10.5px; color:#D8D2C2; font-weight:500; margin-top:3px; width:62px; height:27px; text-align:center; line-height:1.27; word-break:keep-all; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .who2{margin-left:12px; display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; padding-top:4px; min-width:120px; max-width:170px}
  .who2 .nm{background:var(--surface); border:1.5px solid var(--gold-deep); border-radius:8px; padding:5px 14px; font-size:15px; font-weight:700; color:var(--gold); max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center}
  .who2 .x{font-size:14px; padding:1px 8px}
  .asgrow{display:flex; gap:9px; align-items:center; padding:5px 8px; border-bottom:1px solid var(--line); font-size:13.5px}
  .asgrow .pos{color:var(--gold); font-weight:700; min-width:56px}
  .asgrow.mine{background:var(--gold-soft); border-radius:6px}
  .asgrow .you{color:var(--gold); font-size:11px; font-weight:700}
  .disc{background:#1F2430; border:1px solid #3A4254; border-radius:8px; padding:11px 13px; font-size:13px}
  .disc pre{margin:0; white-space:pre-wrap; font-family:inherit; line-height:1.65}
  .miss{color:var(--warn)}
  .cat h3{font-family:'Noto Serif KR',serif; font-size:15px; color:var(--gold); font-weight:600; margin:14px 0 7px; border-bottom:1px solid var(--line); padding-bottom:5px}
  .icons{display:flex; gap:5px; align-items:center; flex-wrap:wrap}
  .ibox{width:40px; height:40px; background:var(--surface); border:1px solid var(--line); border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer}
  .ibox img{width:38px; height:38px}
  .ibox.ghost{opacity:.4}
  .ibox.emptybox{border-style:dashed; color:var(--muted); font-size:15px; opacity:.7}
  .ibox.preset{opacity:.85; border-style:dashed; border-color:var(--gold-deep)}
  .ibox.emptybox:hover{color:var(--gold); opacity:1}
  .ibox:hover{border-color:var(--gold)}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
  .modal .box{background:var(--surface); border:1px solid var(--gold-deep); border-radius:10px; padding:16px; max-width:560px; max-height:72vh; overflow:auto}
  .modal .box.big{max-width:1100px; width:94vw; max-height:84vh; padding:18px 22px}
  .psec h4{font-family:'Noto Serif KR',serif; color:var(--gold); font-size:14.5px; font-weight:600; margin:14px 0 8px; border-bottom:1px solid var(--line); padding-bottom:5px}
  .psec:first-of-type h4{margin-top:6px}
  .modal h3{margin:0 0 10px; color:var(--gold); font-size:15px; font-family:'Noto Serif KR',serif}
  .pgrid{display:flex; flex-wrap:wrap; gap:8px}
  .pitem{width:82px; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:6px 3px; cursor:pointer; text-align:center; font-size:11px; color:#D8D2C2; line-height:1.25; font-family:inherit}
  .pitem img{width:44px; height:44px; display:block; margin:0 auto 2px}
  .pitem:hover{border-color:var(--gold); color:var(--gold)}
  .pitem.hl{border-color:var(--gold-deep); background:var(--gold-soft); color:var(--gold)}
  .chip img{width:18px; height:18px; vertical-align:-4px; margin-right:3px}
  /* 스플래시 */
  #splash{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; opacity:1; transition:opacity .55s ease}
  #splash.out{opacity:0; pointer-events:none}
  #splash .coverlogo{animation:splIn .7s ease both}
  .splimg{max-width:min(400px,80vw); border-radius:14px; border:3px solid var(--gold-deep); box-shadow:0 8px 40px rgba(0,0,0,.5), 0 0 26px rgba(201,162,51,.2); animation:splIn .7s .15s ease both}
  @keyframes splIn{ from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none} }
  @media (prefers-reduced-motion: reduce){ #splash .coverlogo, .splimg{animation:none} }
  /* 표지 */
  .cover{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:82vh; text-align:center; gap:14px; overflow:hidden}
  .coverlogo{display:flex; flex-direction:column; line-height:1.05}
  .clw{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:clamp(44px,8vw,72px); color:#E8A33D; text-shadow:3px 3px 0 #59391D, 0 0 24px rgba(232,163,61,.35); letter-spacing:.02em}
  .cst{font-family:'Jua','IBM Plex Sans KR',sans-serif; font-size:clamp(18px,3vw,26px); color:var(--gold); letter-spacing:.55em; margin-top:6px; text-indent:.55em}
  .coverimg{max-width:min(460px,88vw); border-radius:16px; border:3px solid var(--gold-deep); box-shadow:0 8px 40px rgba(0,0,0,.55), 0 0 30px rgba(201,162,51,.18); margin-top:6px}
  .coverdesc{color:var(--muted); font-size:14.5px; letter-spacing:.06em; margin:4px 0 2px}
  .coverbtn{font-size:17px; padding:13px 46px; border-radius:10px; margin-left:0 !important}
  .spark{position:absolute; color:var(--gold); font-size:20px; opacity:0; animation:twinkle 2.6s ease-in-out infinite}
  @keyframes twinkle{ 0%,100%{opacity:0; transform:scale(.6)} 50%{opacity:.9; transform:scale(1.15)} }
  @media (prefers-reduced-motion: reduce){ .spark{animation:none; opacity:.5} }
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gold); color:#191509; padding:8px 18px; border-radius:999px; font-weight:700; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:99; max-width:90vw}
  .toast.show{opacity:1}
  .hint{color:var(--muted); font-size:12.5px; margin:6px 0 0}
  .ctlhint{color:#E8C86A; font-size:12px; font-weight:500; margin-left:6px; white-space:nowrap}
  .evcard{background:var(--raised); border:1px solid var(--gold-deep); border-radius:8px; padding:13px 16px; margin-bottom:9px; cursor:pointer}
  .evcard h3{margin:0; font-size:16px; color:var(--gold); font-family:'Noto Serif KR',serif; font-weight:600}
  .evcard .sub{font-size:12.5px; color:var(--muted); margin-top:2px}
  .badge{display:inline-block; font-size:11px; border-radius:4px; padding:1px 7px; margin-left:8px; vertical-align:1px}
  .badge.open{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold-deep)}
  .badge.confirmed{background:rgba(127,176,105,.15); color:var(--ok); border:1px solid var(--ok)}
  .roster li{margin:3px 0; font-size:13.5px}
  .roster{columns:2; margin:8px 0; padding-left:20px}
  @media(max-width:600px){.roster{columns:1}}
  .center{text-align:center; color:var(--muted); padding:30px 0}
  a{color:var(--gold)}
</style>
</head>
<body>
<!-- 스플래시: 접속 시마다 잠깐 표시 후 사라짐 -->
<div id="splash">
  <div class="coverlogo">
    <span class="clw">LYM WORLD</span>
    <span class="cst">시 트 지</span>
  </div>
  <img src="chars.png" alt="" class="splimg">
</div>
<div class="wrap">
  <header class="top">
    <div class="logohead" onclick="location.hash=''; location.reload()" title="처음 화면으로 (새로고침)">
      <img src="chars.png" alt="Lym World">
      <div class="logotxt"><span class="lw">LYM WORLD</span><span class="st">시트지</span></div>
    </div>
    <span id="crumb" style="display:none"></span>
  </header>
  <div id="view"><div class="center">불러오는 중...</div></div>
  <div style="text-align:center; color:#3d424a; font-size:10.5px; margin-top:40px; padding-bottom:10px">© 2026 LYM WORLD 시트지 · All rights reserved · 무단 복제·배포 금지</div>
